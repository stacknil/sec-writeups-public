---
name: Repo Sentinel Gate

'on':
  pull_request:

permissions:
  contents: read

jobs:
  changed-file-gate:
    name: Changed-file error gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install repo-sentinel-lite==0.8.1

      - name: Run changed-file gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/repo_sentinel_gate.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --output repo-sentinel-changed.txt

      - name: Upload changed-file report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-sentinel-changed-file-report
          path: repo-sentinel-changed.txt
          if-no-files-found: ignore
          retention-days: 14

  synthetic-contract:
    name: Synthetic PASS/FAIL/redaction contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install repo-sentinel-lite==0.8.1

      - name: Run synthetic contract
        run: python scripts/test_repo_sentinel_integration.py

  baseline-audit:
    name: Baseline audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install repo-sentinel-lite==0.8.1

      - name: Audit baseline drift
        shell: bash
        run: |
          if [[ ! -f .reposentinel-baseline.json ]]; then
            {
              echo "No .reposentinel-baseline.json;"
              echo "baseline audit is not configured."
            } | tee repo-sentinel-baseline-audit.txt
            exit 0
          fi
          python -m repo_sentinel baseline audit --format text . \
            | tee repo-sentinel-baseline-audit.txt

      - name: Upload baseline audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-sentinel-baseline-audit
          path: repo-sentinel-baseline-audit.txt
          if-no-files-found: ignore
          retention-days: 14
